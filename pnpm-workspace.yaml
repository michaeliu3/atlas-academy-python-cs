packages:
  - .

# Keep the security-patched implementations scoped to Next's dependency tree.
overrides:
  "next>postcss": 8.5.18
  "next>sharp": 0.35.2

# This private site deploys only reviewed, committed lockfile state.
trustLockfile: true

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

patchedDependencies:
  vinext@0.0.50: patches/vinext@0.0.50.patch
