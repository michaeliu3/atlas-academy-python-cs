packages:
  - .

# Keep advisory remediations scoped to their affected dependency paths.
overrides:
  "next>postcss": 8.5.18
  "next>sharp": 0.35.2
  # `minimatch@3` accepts brace-expansion ^1.1.7; constrain only that
  # development-tooling path to the advisory's patched 1.x line.
  "minimatch@3>brace-expansion": 1.1.17

# This private site deploys only reviewed, committed lockfile state.
trustLockfile: true

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

patchedDependencies:
  vinext@0.0.50: patches/vinext@0.0.50.patch
