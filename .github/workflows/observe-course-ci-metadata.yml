name: Observe Course CI metadata

on:
  workflow_run:
    workflows:
      - Course CI
    types:
      - completed

permissions:
  actions: read

jobs:
  observe:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha != '' &&
      github.event.workflow_run.display_title == 'atlas-course-ci-gate'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read and validate Course CI metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const expected = Object.freeze({
              repository: "michaeliu3/atlas-academy-python-cs",
              workflowId: 323581527,
              workflowName: "Course CI",
              workflowPath: ".github/workflows/ci.yml",
              displayTitle: "atlas-course-ci-gate",
              event: "pull_request",
              requiredJobNames: [
                "Portal quality gate",
                "Teaching models on Python 3.12",
                "Teaching models on Python 3.14",
                "Browser accessibility acceptance",
              ],
            });
            const sourceHeadSha = context.payload.workflow_run.head_sha;
            const runId = context.payload.workflow_run.id;
            const runAttempt = context.payload.workflow_run.run_attempt;
            const fail = (message) => {
              throw new Error(`Course CI metadata observation rejected: ${message}`);
            };
            const assert = (condition, message) => {
              if (!condition) fail(message);
            };
            const fullSha = /^[0-9a-f]{40}$/u;
            assert(Number.isSafeInteger(runId) && runId > 0, "event run id is invalid");
            assert(Number.isSafeInteger(runAttempt) && runAttempt > 0, "event run attempt is invalid");
            assert(fullSha.test(sourceHeadSha), "event source head SHA is invalid");

            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              attempt_number: runAttempt,
            };
            const { data: run } = await github.request(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}",
              request,
            );
            assert(run.id === runId, "readback run id differs from event run id");
            assert(run.run_attempt === runAttempt, "readback run attempt differs from event run attempt");
            assert(run.repository?.full_name === expected.repository, "readback repository is not canonical");
            assert(run.head_repository?.full_name === expected.repository, "readback head repository is not canonical");
            assert(run.head_sha === sourceHeadSha, "readback source head differs from event source head");
            assert(
              run.workflow_id === expected.workflowId &&
                run.name === expected.workflowName &&
                run.path === expected.workflowPath &&
                run.event === expected.event,
              "readback workflow identity differs from the bounded observer policy",
            );
            assert(
              run.display_title === expected.displayTitle,
              "readback workflow display title differs from the bounded observer policy",
            );
            assert(run.status === "completed" && run.conclusion === "success", "readback run is not successful");
            assert(
              run.html_url === `https://github.com/${expected.repository}/actions/runs/${runId}`,
              "readback run URL is inconsistent",
            );

            const jobs = await github.paginate(
              "GET /repos/{owner}/{repo}/actions/runs/{run_id}/attempts/{attempt_number}/jobs",
              request,
              (response) => response.data.jobs,
            );
            const expectedJobNames = new Set(expected.requiredJobNames);
            const expectedJobs = jobs.filter((job) => expectedJobNames.has(job.name));
            const jobIds = new Set();
            const jobNames = new Set();
            for (const job of jobs) {
              assert(Number.isSafeInteger(job.id) && job.id > 0, "readback job id is invalid");
              assert(!jobIds.has(job.id), `duplicate readback job id: ${job.id}`);
              assert(!jobNames.has(job.name), `duplicate readback job name: ${job.name}`);
              assert(job.run_id === runId, `job ${job.name} belongs to another run`);
              assert(job.run_attempt === runAttempt, `job ${job.name} belongs to another run attempt`);
              assert(job.head_sha === sourceHeadSha, `job ${job.name} belongs to another source head`);
              assert(
                job.status === "completed" && job.conclusion === "success",
                `job ${job.name} is not successful`,
              );
              jobIds.add(job.id);
              jobNames.add(job.name);
            }
            for (const requiredJobName of expected.requiredJobNames) {
              assert(jobNames.has(requiredJobName), `missing required job: ${requiredJobName}`);
            }

            core.notice(
              JSON.stringify({
                kind: "source-head-attached Course CI metadata observation",
                repository: expected.repository,
                sourceHeadSha,
                runId,
                runAttempt,
                runUrl: run.html_url,
                requiredJobNames: expected.requiredJobNames,
              }),
            );
