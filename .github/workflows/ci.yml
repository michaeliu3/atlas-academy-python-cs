name: Course CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate structural course contract and release inputs
        run: pnpm validate:course:inputs
      - name: Synchronize learner content from checked-in inputs
        run: pnpm sync:modules
      - name: Verify generated course artifacts are committed
        run: pnpm check:generated
      - name: Lint
        run: pnpm lint
      - name: Build and test portal
        run: pnpm test

  teaching-models:
    name: Teaching models on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: portal
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate checked-in release inputs
        run: pnpm validate:course:inputs
      - name: Synchronize local models from checked-in inputs
        run: pnpm sync:modules
      - name: Verify generated course artifacts are committed
        run: pnpm check:generated
      - name: Run deterministic local teaching models
        run: python -m unittest discover -s public/downloads -p "test_module*_reference.py"
