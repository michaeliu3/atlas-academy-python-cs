name: Course CI

run-name: >-
  atlas-course-ci-${{ github.event_name == 'pull_request' &&
  (github.event.pull_request.draft && 'draft' || 'gate') || github.event_name }}

on:
  push:
    branches:
      - main
  pull_request:
    # Keep a reviewable, full-quality gate, but do not allocate hosted runners
    # for each exploratory update while the pull request is explicitly Draft.
    # `ready_for_review` launches the same four required checks before review.
    types:
      - opened
      - reopened
      - ready_for_review
      # Emit a skipped, zero-runner workflow when a PR returns to draft so the
      # concurrency group cancels any now-obsolete full gate for that PR.
      - converted_to_draft
      - synchronize

permissions:
  contents: read

concurrency:
  group: course-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      content: ${{ steps.scope.outputs.content }}
      apparatus: ${{ steps.scope.outputs.apparatus }}
      sources: ${{ steps.scope.outputs.sources }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify content and apparatus changes
        id: scope
        shell: pwsh
        env:
          ATLAS_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          ATLAS_HEAD_SHA: ${{ github.sha }}
        run: |
          $baseSha = $env:ATLAS_BASE_SHA
          $headSha = $env:ATLAS_HEAD_SHA
          if ($baseSha -match '^0+$') {
            $baseSha = "$headSha^"
          }
          $changedFiles = @(git diff --name-only $baseSha $headSha)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not classify the changed source range $baseSha..$headSha."
          }
          $contentChanged = $false
          $apparatusChanged = $false
          $sourcesChanged = $false
          foreach ($path in $changedFiles) {
            if ($path -like 'content/*') {
              $contentChanged = $true
            }
            if ($path -like 'content/course/*' -or $path -like 'scripts/*') {
              $apparatusChanged = $true
            }
            if ($path -like 'content/source-maps/*' -or $path -like 'docs/ACADEMIC_CALIBRATION.md' -or $path -like 'docs/research/*') {
              $sourcesChanged = $true
            }
          }
          "content=$($contentChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "apparatus=$($apparatusChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "sources=$($sourcesChanged.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  portal:
    name: Portal quality gate
    needs: change-scope
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate structural course contract and release inputs
        run: pnpm validate:course:inputs
      - name: Synchronize learner content from checked-in inputs
        run: pnpm sync:modules
      - name: Verify generated course artifacts are committed
        run: pnpm check:generated
      - name: Verify generated goal-compliance matrix
        run: pnpm check:goal-compliance
      - name: Validate source URL shape and access-date freshness
        run: pnpm check:source-links
      - name: Check calibration URL liveness when source material changed
        if: needs.change-scope.outputs.sources == 'true'
        run: pnpm check:source-links:live
      - name: Verify generated Worker types
        run: pnpm types:worker
      - name: Strict TypeScript typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build portal
        run: pnpm build
      - name: Share the verified portal build with browser acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlas-portal-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: Run Node content tests
        run: pnpm test:content

  draft-content:
    name: Draft content feedback
    needs: change-scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate structural course contract and release inputs
        run: pnpm validate:course:inputs
      - name: Synchronize learner content from checked-in inputs
        run: pnpm sync:modules
      - name: Verify generated course artifacts are committed
        run: pnpm check:generated
      - name: Verify generated goal-compliance matrix
        run: pnpm check:goal-compliance
      - name: Validate source URL shape and access-date freshness
        run: pnpm check:source-links
      - name: Run the content-focused feedback suite
        run: pnpm test:content

  apparatus:
    name: Node apparatus validation
    needs: [change-scope, portal]
    if: >-
      github.event_name != 'pull_request' && needs.change-scope.outputs.apparatus == 'true' ||
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      needs.change-scope.outputs.apparatus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Reuse the portal build for apparatus checks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-portal-dist-${{ github.run_id }}
          path: dist/
      - name: Run Node apparatus tests
        run: pnpm test:apparatus

  teaching-models:
    name: Teaching models on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [change-scope, portal]
    if: >-
      github.event_name != 'pull_request' && needs.change-scope.outputs.apparatus == 'true' ||
      github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      needs.change-scope.outputs.apparatus == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Portal has already checked the same source head. The Python-only
          # verifier/model suites do not need historical Git ancestry.
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test the runtime teaching-model exercise verifier
        run: python -m unittest discover -s scripts -p "test_verify_teaching_model_exercises.py"
      - name: Verify discovered teaching-model suites execute reference-model code
        run: python scripts/verify_teaching_model_exercises.py
      - name: Verify the bounded M32 NumPy authoring observation
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.3.5
          python scripts/test_m32_numpy_layout_observation.py
      - name: Run deterministic local teaching models
        run: python -m unittest discover -s public/downloads -p "test_module*_reference.py"
      - name: Run private preview teaching model inputs
        run: python -m unittest discover -s content/course/reference-models -p "test_module26_reference.py"

  browser-accessibility:
    name: Browser accessibility acceptance
    runs-on: ubuntu-latest
    needs: [change-scope, portal]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The portal gate has already verified history-dependent evidence.
          # Browser acceptance only needs the exact checked-out source tree.
          fetch-depth: 1
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate structural course contract and release inputs
        run: pnpm validate:course:inputs
      - name: Synchronize learner content from checked-in inputs
        run: pnpm sync:modules
      - name: Verify generated course artifacts are committed
        run: pnpm check:generated
      - name: Verify generated goal-compliance matrix
        run: pnpm check:goal-compliance
      - name: Reuse the portal build from the quality gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: atlas-portal-dist-${{ github.run_id }}
          path: dist/
      - name: Install Chromium for browser acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the production portal in Chromium
        run: pnpm test:browser:ci
      - name: Upload browser acceptance evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-browser-accessibility-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
