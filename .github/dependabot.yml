version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One reviewed version-update batch avoids five independent full CI runs.
    # Security updates are not matched by this version-update group or limit.
    open-pull-requests-limit: 1
    groups:
      routine-version-updates:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Keep the action updates reviewable as one full, protected CI gate.
    open-pull-requests-limit: 1
    groups:
      routine-version-updates:
        patterns:
          - "*"
