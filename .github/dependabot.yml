version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One reviewed routine batch avoids five independent full CI runs. Major
    # upgrades and security updates stay isolated for a narrower review.
    open-pull-requests-limit: 1
    groups:
      routine-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Keep routine action updates reviewable as one full, protected CI gate.
    # Major action upgrades remain distinct.
    open-pull-requests-limit: 1
    groups:
      routine-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
